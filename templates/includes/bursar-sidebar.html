{% load static %}

<aside id="application-sidebar-brand"
    class="hs-overlay hs-overlay-open:translate-x-0 -translate-x-full transform hidden xl:block xl:translate-x-0 xl:end-auto xl:bottom-0 fixed top-0 with-vertical h-screen z-[999] flex-shrink-0 border-r-[1px] w-[270px] border-gray-400 bg-white left-sidebar transition-all duration-300">
    <div class="p-4 flex flex-col items-center justify-center">
        <a href="{% url 'accounts:bursar_dashboard' %}" class="flex flex-col items-center justify-center">
            <img src="{% static 'assets/images/logos/almora.jpg' %}" width="100px" height="100px"
                style="border: solid 1px" alt="Logo-Dark" class="rounded-full ring-2 ring-black" />
            <h2 class="font-semibold text-2xl my-2 text-right">Almora <br> Polytechnic Pantisawa</h2>
            <small class="font-light text-center text-xm text-slate-600">Pantisawa, Nigeria.</small>
        </a>
    </div>
    <div class="scroll-sidebar" data-simplebar="">
        <div class="px-6 mt-4">
            <!-- Bursar Badge -->
            <div class="bg-green-50 rounded-lg p-3 mb-4">
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 bg-green-500 rounded-full flex items-center justify-center">
                        <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z">
                            </path>
                        </svg>
                    </div>
                    <div>
                        <p class="text-xs font-semibold text-green-800">Bursar</p>
                        <p class="text-xs text-green-600">{{ request.user.bursarprofile.staff_id }}</p>
                    </div>
                </div>
            </div>

            <nav class="w-full flex flex-col sidebar-nav">
                <ul id="sidebarnav" class="text-gray-600 text-sm">

                    <li class="sidebar-item">
                        <a class="sidebar-link gap-3 py-2 px-3 rounded-md w-full flex items-center hover:text-white hover:bg-green-500"
                            href="{% url 'accounts:bursar_dashboard' %}">
                            <i class="ti ti-layout-dashboard text-xl"></i>
                            <span>Dashboard</span>
                        </a>
                    </li>

                    <li class="sidebar-item">
                        <a class="sidebar-link gap-3 py-2 px-3 rounded-md w-full flex items-center hover:text-white hover:bg-green-500"
                            href="{% url 'accounts:bursar_payments' %}">
                            <i class="ti ti-report-money text-xl"></i>
                            <span>Payments</span>
                        </a>
                    </li>

                    <li class="sidebar-item">
                        <a class="sidebar-link gap-3 py-2 px-3 rounded-md w-full flex items-center hover:text-white hover:bg-green-500"
                            href="{% url 'accounts:bursar_application_fees' %}">
                            <i class="ti ti-file-invoice text-xl"></i>
                            <span>Application Fees</span>
                        </a>
                    </li>

                    <li class="sidebar-item">
                        <a class="sidebar-link gap-3 py-2 px-3 rounded-md w-full flex items-center hover:text-white hover:bg-green-500"
                            href="{% url 'accounts:bursar_fee_structure' %}">
                            <i class="ti ti-settings-dollar text-xl"></i>
                            <span>Fee Structure</span>
                        </a>
                    </li>

                    <li class="sidebar-item mt-6 border-t pt-4">
                        <a class="sidebar-link gap-3 py-2 px-3 rounded-md w-full flex items-center hover:text-white hover:bg-red-500 text-red-600"
                            href="{% url 'accounts:logout' %}">
                            <i class="ti ti-logout text-xl"></i>
                            <span>Logout</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</aside>
