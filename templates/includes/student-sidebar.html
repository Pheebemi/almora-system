{% load static %}

<aside
  id="application-sidebar-brand"
  class="hs-overlay hs-overlay-open:translate-x-0 -translate-x-full transform hidden xl:block xl:translate-x-0 xl:end-auto xl:bottom-0 fixed top-0 with-vertical h-screen z-[999] flex-shrink-0 border-r-[1px] w-[270px] border-gray-400 bg-white left-sidebar transition-all duration-300"
>
  <!-- ---------------------------------- -->
  <!-- Start Vertical Layout Sidebar -->
  <!-- ---------------------------------- -->
  <div class="p-4 flex flex-col items-center justify-center">
    <a href="{% url 'dashboard:student_dashboard' %}" class="flex flex-col items-center justify-center">
      <img
        src="{% static 'assets/images/logos/almola.png' %}"
        width="100px"
        height="100px"
        style="border: solid 1px"
        >
      <h2 class="font-semibold text-2xl my-2 text-center">Almola <br> Polytechnic Pantisawa</h2>
      <small class="font-light text-center text-xm text-slate-600"
        >Pantisawa, Nigeria.</small
      >
    
    </a>
  </div>
  <div class="scroll-sidebar" data-simplebar="">
    <div class="px-6 mt-8">
      <nav class="w-full flex flex-col sidebar-nav">
        <ul id="sidebarnav" class="text-gray-600 text-sm">
          
          <li class="sidebar-item">
            <a
              class="sidebar-link gap-3 py-2 px-3 rounded-md w-full flex items-center hover:text-white hover:bg-blue-500"
              href="{% url 'dashboard:student_dashboard' %}"
            >
              <i class="ti ti-layout-dashboard text-xl"></i>
              <span>Dashboard</span>
            </a>
          </li>

        
          <li class="sidebar-item">
            <a
              class="sidebar-link gap-3 py-2 px-3 rounded-md w-full flex items-center hover:text-white hover:bg-blue-500"
              href="{% url 'accounts:student_courses' %}"
            >
              <i class="ti ti-cards text-xl"></i> <span>Courses</span>
            </a>
          </li>
          <li class="sidebar-item">
            <a
              class="sidebar-link gap-3 py-2 px-3 rounded-md w-full flex items-center hover:text-white hover:bg-blue-500"
              href="{% url 'accounts:school_fees' %}"
            >
              <i class="ti ti-calendar text-xl"></i> <span>PayFees</span>
            </a>
          </li>
          <li class="sidebar-item">
            <a
              class="sidebar-link gap-3 py-2 px-3 rounded-md w-full flex items-center hover:text-white hover:bg-blue-500"
              href="{% url 'accounts:change_password' %}"
            >
              <i class="ti ti-lock text-xl"></i> <span>Change Password</span>
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </div>

  <!-- </aside> -->
</aside>
